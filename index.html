<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saye | Personal Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI",system-ui,sans-serif;
        }
        body {
            background: #0d0d0d;
            color: #eaeaea;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 12%;
            line-height: 1.7;
        }
        .name {
            font-size: 3.2rem;
            font-weight: 600;
            letter-spacing: 4px;
            margin-bottom: 12px;
        }
        .info {
            color: #aaa;
            font-size: 1rem;
            max-width: 520px;
            margin-bottom: 30px;
        }
        .links a {
            color: #fff;
            text-decoration: none;
            border: 1px solid #444;
            padding: 8px 18px;
            border-radius: 4px;
            margin-right: 12px;
            margin-bottom: 10px;
            display: inline-block;
            transition: 0.2s ease;
        }
        .links a:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
        .foot {
            position: fixed;
            bottom: 20px;
            left: 12%;
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <h1 class="name">Saye</h1>

    <p class="info">
        科比科比 乐于探索。<br>
        保持好奇 持续学习。
    </p>

    <div class="links">
        <a href="https://github.com/Saye-Zou">GitHub</a>
        <a href="#">Blog</a>
        <a href="#">About</a>
    </div>

    <div class="foot">
        © 2026 Saye
    </div>

</body>
</html>
